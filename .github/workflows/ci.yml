name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

  integration:
    name: Browser integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The FFmpeg version string is not portable. The action picks a source by
      # OS *and* architecture: macOS arm64 pulls osxexperts.net, which tags
      # builds without the point ("9"), while Linux and macOS x64 pull
      # BtbN and evermeet.cx, which both use the full "9.0". Guarding on OS
      # alone would break the moment an Intel macOS runner is added.
      - name: Set up FFmpeg (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "9"

      - name: Set up FFmpeg
        if: runner.os != 'macOS' || runner.arch != 'ARM64'
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "9.0"

      - name: Verify system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$browser" --version
          echo "WIRBEL_BROWSER=$browser" >> "$GITHUB_ENV"
          ffmpeg -version

      - name: Verify system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          browser="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$browser" ]; then
            echo "::error::Expected Google Chrome at $browser on the macOS runner."
            exit 1
          fi
          "$browser" --version
          ffmpeg -version

      - name: Run integration tests
        run: npm test
        env:
          WIRBEL_INTEGRATION: "1"

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Create release
        run: npx --yes semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
